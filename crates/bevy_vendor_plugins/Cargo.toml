[package]
name = "bevy_vendor_plugins"
version = "0.19.0"
edition = "2024"
description = "Vendor plugin interfaces for rendering-backsend-replacement: upscaler / frame-gen / denoiser / latency / pure-AA contracts, probe protocol, adapter templates and TAAU exclusivity (M3a)"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "rendering", "upscaling", "frame-generation"]

# M3a: vendor plugin interfaces (spec §5.7, design §2.2.2.4, construction §7.1).
# This crate is the *contract* layer only: no vendor SDK is bundled, linked or
# required. Adapter templates implement these traits against an SDK the
# developer drops into `plugins/<backend>/<vendor>/` at build time.

[features]
# Backend probes are pure path scans (no SDK), so no per-vendor features are
# required for the contract crate itself. Consumers add their own features
# when wiring a concrete adapter.
default = []

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.19.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0" }
bevy_render = { path = "../bevy_render", version = "0.19.0" }
bevy_camera = { path = "../bevy_camera", version = "0.19.0" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.19.0" }
bevy_math = { path = "../bevy_math", version = "0.19.0" }

# other
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true