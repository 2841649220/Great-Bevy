[package]
name = "bevy_render"
version = "0.19.0"
edition = "2024"
description = "Provides rendering functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
decoupled_naga = ["bevy_shader/decoupled_naga"]

multi_threaded = ["bevy_tasks/multi_threaded", "bevy_transform/multi_threaded"]

morph = ["bevy_mesh/morph"]

shader_format_spirv = ["bevy_shader/shader_format_spirv"]

trace = ["profiling"]
tracing-tracy = ["dep:tracy-client"]
ci_limits = []
detailed_trace = []
# Pre-populate buffer labels with buffer types for debugging.
type_label_buffers = []
# Enables collecting extra information for debugging.
debug = ["type_label_buffers", "bevy_utils/debug"]
## Adds serialization support through `serde`.
serialize = ["bevy_mesh/serialize"]

reflect_auto_register = ["bevy_app/reflect_auto_register"]
reflect_functions = ["bevy_app/reflect_functions"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.19.0" }
bevy_asset = { path = "../bevy_asset", version = "0.19.0" }
bevy_color = { path = "../bevy_color", version = "0.19.0", features = [
  "serialize",
  "wgpu-types",
] }
bevy_derive = { path = "../bevy_derive", version = "0.19.0" }
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.19.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0" }
bevy_encase_derive = { path = "../bevy_encase_derive", version = "0.19.0" }
bevy_math = { path = "../bevy_math", version = "0.19.0" }
bevy_material = { path = "../bevy_material", version = "0.19.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.19.0" }
bevy_log = { path = "../bevy_log", version = "0.19.0" }
bevy_material_macros = { path = "../bevy_material/macros", version = "0.19.0" }
bevy_render_macros = { path = "../bevy_render/macros", version = "0.19.0" }
bevy_time = { path = "../bevy_time", version = "0.19.0" }
bevy_transform = { path = "../bevy_transform", version = "0.19.0" }
bevy_window = { path = "../bevy_window", version = "0.19.0" }
bevy_utils = { path = "../bevy_utils", version = "0.19.0" }
bevy_tasks = { path = "../bevy_tasks", version = "0.19.0" }
bevy_image = { path = "../bevy_image", version = "0.19.0" }
bevy_mesh = { path = "../bevy_mesh", version = "0.19.0" }
bevy_camera = { path = "../bevy_camera", version = "0.19.0" }
bevy_shader = { path = "../bevy_shader", version = "0.19.0" }
bevy_platform = { path = "../bevy_platform", version = "0.19.0", default-features = false, features = [
  "std",
  "serialize",
] }

# rendering
image = { version = "0.25.2", default-features = false }
# M1-3: the diligent swap chain needs the Win32 HWND from the raw window
# handle (same version/features as bevy_window's dependency).
raw-window-handle = { version = "0.6", features = [
  "alloc",
], default-features = false }
# Diligent Engine backend wrapper (M1b replacement target; diligent-rs is a
# standalone workspace crate, consumed here as a read-only path dependency)
diligent-rs = { path = "../diligent-rs" }
# misc
wgpu-types = { version = "30.0.0", default-features = false }
# hlsl-out / spv-out: the Diligent shader path compiles the naga module to
# HLSL (D3D12) or SPIR-V (Vulkan) itself (M1b replacement point 1).
# spv-in: SPIR-V shader input for the same path.
naga = { version = "30.0.0", features = ["wgsl-in", "hlsl-out", "spv-out", "spv-in"] }
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
encase = "0.12"
glam = { version = "0.32.0", default-features = false, features = [
  "std",
  "encase",
] }
# For wgpu profiling using tracing. Use `RUST_LOG=info` to also capture the wgpu spans.
profiling = { version = "1", features = [
  "profile-with-tracing",
], optional = true }
async-channel = "2.3.0"
nonmax = "0.5"
smallvec = { version = "1", default-features = false, features = ["const_new"] }
offset-allocator = "0.2"
variadics_please = "1.1"
tracy-client = { version = "0.18.3", optional = true }
indexmap = { version = "2" }
bitflags = "2"
itertools = "0.14"
weak-table = "0.3"

[dev-dependencies]
proptest = "1"
proptest-derive = "0.2"

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
send_wrapper = { version = "0.6.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
web-sys = { version = "0.3.67", features = [
  'Blob',
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Url',
  'Window',
] }
wasm-bindgen = "0.2"
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
bevy_app = { path = "../bevy_app", version = "0.19.0", default-features = false, features = [
  "web",
] }
bevy_platform = { path = "../bevy_platform", version = "0.19.0", default-features = false, features = [
  "web",
] }
bevy_reflect = { path = "../bevy_reflect", version = "0.19.0", default-features = false, features = [
  "web",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
