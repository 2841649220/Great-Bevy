[package]
name = "bevy_anti_alias"
version = "0.19.0"
edition = "2024"
description = "Provides various anti aliasing implementations for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
trace = []
webgl = []
webgpu = []
smaa_luts = ["bevy_image/ktx2", "bevy_image/zstd"]
# M5a (task 16.3): the dlss feature no longer pulls wgpu/dlss_wgpu into the
# dependency graph. The dlss module now compiles against self-authored
# placeholder types (DlssPerfQualityMode etc.); it is inert at runtime until
# the NGX DLSS 4.5 backend lands (task 16.2). `force_disable_dlss` still
# skips the module entirely (`--all-features` enables both).
dlss = ["dep:uuid"]
force_disable_dlss = []

[dependencies]
# bevy
bevy_asset = { path = "../bevy_asset", version = "0.19.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.19.0" }
bevy_render = { path = "../bevy_render", version = "0.19.0" }
bevy_camera = { path = "../bevy_camera", version = "0.19.0" }
bevy_math = { path = "../bevy_math", version = "0.19.0" }
bevy_utils = { path = "../bevy_utils", version = "0.19.0" }
bevy_app = { path = "../bevy_app", version = "0.19.0" }
bevy_image = { path = "../bevy_image", version = "0.19.0" }
bevy_derive = { path = "../bevy_derive", version = "0.19.0" }
bevy_shader = { path = "../bevy_shader", version = "0.19.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.19.0" }
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.19.0" }

# other
tracing = { version = "0.1", default-features = false, features = ["std"] }
# M5a (task 16.3): the dlss feature now builds against self-authored types
# instead of dlss_wgpu (which is gone from the lockfile); `DlssProjectId`
# still wraps a uuid.
uuid = { version = "1", default-features = false, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["bevy_image/zstd_rust"]
